<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BurhanTv’ye Gönder</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#141414;color:#fff;margin:0;padding:28px 20px}main{max-width:520px;margin:30px auto}.brand{display:inline-block;background:#e50914;font-size:26px;font-weight:bold;padding:10px 16px;border-radius:6px}h1{font-size:28px;line-height:1.2;margin-top:32px}p{color:#bbb;line-height:1.6}label{display:block;margin:28px 0 10px}input{width:100%;font-size:17px;padding:16px;border:1px solid #777;border-radius:6px;background:#242424;color:#fff}button{width:100%;padding:17px;background:#e50914;color:#fff;border:0;border-radius:6px;font-size:19px;font-weight:bold;margin-top:18px}button:disabled{opacity:.5}#result{min-height:55px;color:#fff}small{color:#999}</style><main><div class="brand">BurhanTv</div><h1>Bağlantıyı gönder.<br>Kumandayla izle.</h1><p>TV’de “Telefondan Gönder” ekranı açık olsun. Bilgisayarın açık kalması gerekmez. Doğrudan MP4 veya M3U8 video bağlantısını yapıştır.</p><form id="form"><label for="url">Video bağlantısı</label><input id="url" type="url" placeholder="https://…/film.mp4" required autocomplete="off"><button id="send">TV’de oynat</button></form><p id="result" role="status"></p><small>Film sayfası bağlantıları desteklenmez. Telefonu gönderdikten sonra kapatabilirsin.</small></main><script>
const token=location.pathname.split('/').pop(), button=document.getElementById('send'), result=document.getElementById('result');
document.getElementById('form').onsubmit=async e=>{e.preventDefault();button.disabled=true;result.textContent='TV’ye gönderiliyor…';try{const r=await fetch('/api/pairs/'+token+'/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value})});const data=await r.json();if(!r.ok)throw new Error(data.error);result.textContent='Bağlantı gönderildi. TV’nin yanıtı bekleniyor…';let count=0;const timer=setInterval(async()=>{try{const response=await fetch('/api/pairs/'+token+'/status');if(!response.ok)throw new Error();const s=await response.json();if(s.sequence!==data.sequence||++count>20){clearInterval(timer);result.textContent='Gönderildi. Oynatma durumunu TV’den kontrol et.';button.disabled=false;return;}if(['playing','error','closed'].includes(s.state)){clearInterval(timer);result.textContent=s.state==='playing'?'TV’de oynatma başladı. Kumandayı kullanabilirsin.':s.state==='error'?'TV videoyu açamadı: '+s.message:'TV bağlantıyı aldı. Kumandayla devam edebilirsin.';button.disabled=false;}}catch(_){clearInterval(timer);result.textContent='Bağlantı gönderildi; TV durumuna ulaşılamadı.';button.disabled=false;}},1000);}catch(err){result.textContent=err.message||'Bağlantı kurulamadı.';button.disabled=false;}};
</script></html>
